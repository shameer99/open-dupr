version: "1"
services:
  - type: web
    name: open-dupr
    runtime: static
    repo: https://github.com/shameer99/open-dupr
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    domains:
      - www.opendupr.com
      - opendupr.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://api.dupr.gg/*
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: checksPass
    rootDir: open-dupr-react
    previews:
      generation: automatic
